id: x-2-exposure-01-trends

data:
  - name:
      en: Service exposure over time
      cn: 服务暴露面的时间走势
    qa:
      - id: is-nginx-winning
        question:
      en: Is nginx winning?
      cn: 是 nginx 在赢吗？
        answer:
          en: >
            Not necessarily, and the chart does not claim it. nginx sits above apache throughout the window and the gap widens toward 2026 — but both lines fall from their 2022 peaks, and Shodan Trends gives you 113 months to judge whether that decline is hardening or measurement noise. The useful question is whether a specific product's exposed footprint shrinks after a patch cycle, and monthly counts answer that directly.
          cn: >
            不一定，这张图也不这么声称。整个窗口里 nginx 都在 apache 之上，而且到 2026 年差距还在拉大——但两条线都从 2022 年的高点往下走，而 Shoden Trends 给了你 113 个月去判断这个下降到底是加固还是测量噪声。真正有用的问题是：某个产品的暴露面在一次补丁周期之后会不会缩小。月度计数能直接回答。
        confidence: 10
        reference:
          - docs/2-exposure/01-trends/en.md
          - docs/2-exposure/01-trends/cn.md
