id: x-2-exposure-03-ports-networks-os

data:
  - name:
      en: Ports, networks, operating systems
      cn: 端口、网络与操作系统
    qa:
      - id: odd-ports
        question:
      en: Why do so many nginx hosts run on port 8880 or 8443?
      cn: 为什么这么多 nginx 跑在 8880 或 8443 这种端口上？
        answer:
          en: >
            Those are not random choices — 8880 and 8443 are the defaults of specific panels and proxy stacks. A non-standard port in front of nginx is usually a tunnel or a management panel, which means the port alone identifies the stack before you ever connect. That is why port distributions are worth charting and not just listing.
          cn: >
            那些不是随手挑的——8880 和 8443 是特定面板和代理栈的默认值。nginx 前面的非标准端口通常意味着一个隧道或管理面板，也就是说光看端口、还没连上去，你就已经知道那套栈是什么了。这就是端口分布值得画成图、而不只是列一张表的原因。
        confidence: 10
        reference:
          - docs/2-exposure/03-ports-networks-os/en.md
          - docs/2-exposure/03-ports-networks-os/cn.md
