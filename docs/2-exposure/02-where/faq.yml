id: x-2-exposure-02-where

data:
  - name:
      en: Where the exposure is
      cn: 暴露面在哪里
    qa:
      - id: product-vs-abuse
        question:
      en: Are the hot countries the same for products and for abuse?
      cn: 产品和滥用的热门国家是同一批吗？
        answer:
          en: >
            No. "Where is the product" and "where is the abuse" are different questions. Exposed nginx concentrates in a few large hosting economies; exposed telnet and RDP concentrate in whichever providers resell access. The first chart is about market structure, the second is about who to block.
          cn: >
            不是。「产品在哪里」和「滥用在哪里」是两个问题。暴露的 nginx 集中在少数几个大型托管经济体；暴露的 telnet 和 RDP 则集中在那些转售接入的服务商身上。前一张讲的是市场结构，后一张讲的是该封谁。
        confidence: 10
        reference:
          - docs/2-exposure/02-where/en.md
          - docs/2-exposure/02-where/cn.md
